name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only database on the disposable CI service. Never a shared cluster.
      MONGODB_URI: mongodb://127.0.0.1:27017/atai-ci-test
      NEXT_PUBLIC_APP_URL: https://atai.ink
    steps:
      - uses: actions/checkout@v4

      # pnpm is the declared packageManager and the only lockfile that matches
      # package.json; the workspace package @atai-group/sdk needs it too.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit suite
        run: pnpm test

      # Transactions need a replica set, and the service container above is a
      # standalone. This second instance is the one the integration suite uses.
      #
      # mongod must listen on 27018 *inside* the container as well: a member's
      # advertised host has to be an address the node maps to itself, so
      # initiating rs0 at 127.0.0.1:27018 against a container listening on 27017
      # fails with "No host described in new configuration maps to this node".
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27018 mongo:7 --replSet rs0 --bind_ip_all --port 27018
          for i in $(seq 1 60); do
            docker exec mongo-rs mongosh --quiet --port 27018 --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --port 27018 --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }] })'
          for i in $(seq 1 60); do
            [ "$(docker exec mongo-rs mongosh --quiet --port 27018 --eval 'db.hello().isWritablePrimary')" = "true" ] && exit 0
            sleep 2
          done
          echo "replica set did not become primary" >&2
          docker logs mongo-rs --tail 40 >&2
          exit 1

      # A suite that skips itself because it cannot reach a database must never
      # look like a pass. The report is checked rather than the exit code alone.
      - name: Integration suite (real replica set)
        env:
          MONGODB_REPLICA_URI: mongodb://127.0.0.1:27018/atai-ci-integration?replicaSet=rs0
        run: |
          pnpm exec vitest run test/integration --reporter=json --outputFile=/tmp/integration.json
          node -e '
            const r = require("/tmp/integration.json");
            if (!r.success || r.numTotalTests === 0 || r.numPassedTests !== r.numTotalTests) {
              console.error(`integration suite did not fully run: ${r.numPassedTests}/${r.numTotalTests} passed`);
              process.exit(1);
            }
            console.log(`integration suite: ${r.numPassedTests}/${r.numTotalTests} passed`);
          '

      - name: Build
        run: pnpm exec next build