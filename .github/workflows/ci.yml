name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only database on the disposable CI service. Never a shared cluster.
      MONGODB_URI: mongodb://127.0.0.1:27017/atai-ci-test
      NEXT_PUBLIC_APP_URL: https://atai.ink
    steps:
      - uses: actions/checkout@v4

      # pnpm is the declared packageManager and the only lockfile that matches
      # package.json; the workspace package @atai-group/sdk needs it too.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit suite
        run: pnpm test

      # Transactions need a replica set, and the service container above is a
      # standalone. This second instance is the one the integration suite uses;
      # it advertises 127.0.0.1:27018 so the driver on the runner can reach the
      # primary through the published port.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 60); do
            docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo-rs mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }] })'
          for i in $(seq 1 60); do
            [ "$(docker exec mongo-rs mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && exit 0
            sleep 2
          done
          echo "replica set did not become primary" >&2
          exit 1

      - name: Integration suite (real replica set)
        env:
          MONGODB_REPLICA_URI: mongodb://127.0.0.1:27018/atai-ci-integration?replicaSet=rs0
        run: pnpm exec vitest run test/integration

      - name: Build
        run: pnpm exec next build