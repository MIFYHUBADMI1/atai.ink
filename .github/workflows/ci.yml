name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Test-only database on the disposable CI service. Never a shared cluster.
      MONGODB_URI: mongodb://127.0.0.1:27017/atai-ci-test
      NEXT_PUBLIC_APP_URL: https://atai.ink
    steps:
      - uses: actions/checkout@v4

      # pnpm is the declared packageManager and the only lockfile that matches
      # package.json; the workspace package @atai-group/sdk needs it too.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit suite
        run: pnpm test

      - name: Build
        run: pnpm exec next build